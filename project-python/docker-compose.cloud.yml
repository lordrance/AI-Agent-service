# 云 Agent 开发用最小依赖栈（PostgreSQL 16 + pgvector、Redis）
# 不含 Milvus/etcd/minio，启动快、占用小；全栈联调请用 docker-compose.yml
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: project-python-postgres-cloud
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: agent_db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agent_db"]
      interval: 3s
      timeout: 3s
      retries: 15

  redis:
    image: redis:7-alpine
    container_name: project-python-redis-cloud
    ports:
      - "6379:6379"
