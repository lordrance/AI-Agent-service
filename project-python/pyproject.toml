[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-ai-agent"
version = "0.1.0"
description = "企业级 AI Agent 服务（FastAPI + LangChain/LangGraph + RAG）"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Your Team" }]
keywords = ["ai", "agent", "rag", "fastapi", "langchain"]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-core>=0.3.0",
    "langgraph>=0.3.0",
    "langgraph-checkpoint-postgres>=2.0.0",
    "psycopg[binary]>=3.1.0",
    "pymilvus>=2.5.0",
    "redis>=5.2.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "asyncpg>=0.30.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "python-multipart>=0.0.18",
    "tiktoken>=0.8.0",
    "sentence-transformers>=3.3.0",
    "httpx>=0.28.0",
    "loguru>=0.7.0",
    "tenacity>=9.0.0",
    "python-dotenv>=1.0.0",
    "unstructured>=0.16.0",
    "pypdf>=5.0.0",
    "openai>=1.60.0",
    "numpy>=2.0.0",
    "alembic>=1.13.0",
    "pgvector>=0.3.0",
    "slowapi>=0.1.9",
    "PyJWT>=2.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
# UP009: 全仓库沿用 `# -*- coding: utf-8 -*-` 头，保留既有风格
# UP042: str + Enum 为项目有意采用的写法（依赖 .value 访问），不强制改 StrEnum 以免改变 str() 行为
ignore = ["UP009", "UP042"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: 需要 PostgreSQL/pgvector 或 Redis 等外部依赖",
]
