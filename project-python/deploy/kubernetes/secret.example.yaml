#     --from-literal=JWT_SECRET=... \
#     --from-literal=API_KEYS=tenant-a:secret
apiVersion: v1
kind: Secret
metadata:
  name: enterprise-ai-agent-secret
  labels:
    app: enterprise-ai-agent
type: Opaque
stringData:
  OPENAI_API_KEY: "replace-me"
  JWT_SECRET: ""
  API_KEYS: ""
  LANGFUSE_PUBLIC_KEY: ""
  LANGFUSE_SECRET_KEY: ""
